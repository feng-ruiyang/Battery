experiment:
  name: severson_latent_tf_deterministic
  seed: 42
  output_dir: outputs/severson_latent_tf_deterministic
  timestamped_output: true

data:
  processed_dir: data/processed/severson
  split_file: data/processed/severson/splits/cell_random_seed_42.jsonl
  latent_cache: data/processed/severson/latents.npz
  window: 30
  horizon: 80
  latent_dim: 128
  aux_dim: 0

model:
  kind: latent_tf_deterministic
  history_dim: 256
  decoder_dim: 256

training:
  objective: mse
  batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  log_every_n_steps: 50
  max_epochs: 100
  lr: 1.0e-4
  weight_decay: 1.0e-5
  beta_kl: 0.0
  lambda_state: 1.0
  lambda_negative: 0.0
  lambda_smooth: 0.0
  device: auto

logging:
  backend: wandb
  project: battery-soh-bnn
  offline: false
