[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-soh"
version = "0.1.0"
description = "BNN-Transformer battery SoH probabilistic trajectory modeling."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "scipy",
  "pyyaml",
  "tqdm",
]

[project.optional-dependencies]
train = [
  "torch",
  "lightning",
  "einops",
  "matplotlib",
  "wandb",
]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
