experiment:
  name: severson_cycle_autoencoder
  seed: 42
  output_dir: outputs/severson_cycle_autoencoder
  timestamped_output: true

data:
  processed_dir: data/processed/severson
  split_file: data/processed/severson/splits/cell_random_seed_42.jsonl
  latent_cache: data/processed/severson/latents.npz
  channels:
    - V
    - I
    - T
  sequence_length: 1000

model:
  input_dim: 3
  latent_dim: 128
  d_model: 128
  num_layers: 3
  num_heads: 4

training:
  batch_size: 128
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  log_every_n_steps: 50
  max_epochs: 50
  lr: 1.0e-4
  weight_decay: 1.0e-5
  device: auto

logging:
  backend: wandb
  project: battery-soh-bnn
  offline: false
