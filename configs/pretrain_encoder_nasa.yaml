experiment:
  name: nasa_discharge_cycle_autoencoder
  seed: 42
  output_dir: outputs/nasa_discharge_cycle_autoencoder
  timestamped_output: true

data:
  processed_dir: ~/data/nasa/processed
  split_file: ~/data/nasa/processed/splits/cell_random_seed_42.jsonl
  latent_cache: ~/data/nasa/processed/latents.npz
  normalizer: ~/data/nasa/processed/normalization/train_vit_seed_42.json
  channels:
    - V
    - I
    - T
  sequence_length: 1000

model:
  input_dim: 3
  latent_dim: 128
  d_model: 128
  num_layers: 3
  num_heads: 4

training:
  batch_size: 128
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  log_every_n_steps: 10
  max_epochs: 100
  lr: 1.0e-4
  resume_lr: 5.0e-5
  weight_decay: 1.0e-5
  scheduler:
    enabled: true
    name: reduce_on_plateau
    factor: 0.5
    patience: 4
    threshold: 1.0e-4
    min_lr: 1.0e-6
  early_stopping:
    enabled: true
    patience: 12
    min_delta: 1.0e-5
  device: auto

logging:
  backend: wandb
  project: battery-soh-bnn
  offline: false
